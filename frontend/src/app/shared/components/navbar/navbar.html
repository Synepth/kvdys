<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 shadow-sm">
  <div class="container-fluid justify-content-between">

    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
      <span>KVDYS</span>
      <span class="badge bg-white text-primary fs-7">V1.0</span>
    </a>

    <div class="d-flex align-items-center gap-3">

      <div class="dropdown">
        <button
          class="btn btn-link text-white position-relative p-2 border-0 shadow-none"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          title="Bildirimler">

          <i class="bi bi-bell fs-5"></i>

          <span
            *ngIf="unreadCount > 0"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light"
            style="font-size: 0.65rem;">
            {{ unreadCount }}
          </span>
        </button>

        <div class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 p-0" style="width: 320px; max-width: 90vw;">
          <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light rounded-top">
            <span class="fw-bold text-dark small">Bildirimler</span>
            <button
              *ngIf="unreadCount > 0"
              class="btn btn-link btn-sm text-decoration-none p-0 fs-7"
              (click)="markAllAsRead()">
              Tümünü Okundu İşaretle
            </button>
          </div>

          <div class="list-group list-group-flush" style="max-height: 320px; overflow-y: auto;">
            @for (item of notifications; track item.id) {
              <button
                class="list-group-item list-group-item-action p-3 d-flex gap-3 align-items-start border-bottom"
                [class.bg-light]="!item.isRead"
                (click)="markAsRead(item.id)">

                <div class="pt-1">
                  <i class="bi fs-5"
                     [class.bi-ticket-detailed]="item.type === 'ticket'"
                     [class.bi-box-seam]="item.type === 'asset'"
                     [class.text-primary]="item.type === 'ticket'"
                     [class.text-success]="item.type === 'asset'">
                  </i>
                </div>

                <div class="w-100 text-start">
                  <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong class="small text-dark" [class.fw-bold]="!item.isRead">{{ item.title }}</strong>
                    <small class="text-muted" style="font-size: 0.7rem;">{{ item.time }}</small>
                  </div>
                  <p class="mb-0 text-secondary small text-truncate" style="max-width: 210px;">
                    {{ item.message }}
                  </p>
                </div>
              </button>
            } @empty {
              <div class="p-4 text-center text-muted small">
                <i class="bi bi-bell-slash d-block fs-4 text-secondary mb-1"></i>
                Bildiriminiz bulunmuyor.
              </div>
            }
          </div>
        </div>
      </div>

      <div class="vr my-2 text-white opacity-50"></div>

      <div class="dropdown">
        <button class="btn btn-link text-white text-decoration-none dropdown-toggle d-flex align-items-center gap-2 p-0 border-0 shadow-none" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-5"></i>
          <span class="fw-semibold small">Ahmet Yılmaz</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
          <li><a class="dropdown-item small" href="#"><i class="bi bi-person me-2"></i>Profilim</a></li>
          <li><a class="dropdown-item small" href="#"><i class="bi bi-gear me-2"></i>Ayarlar</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item small text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Çıkış Yap</a></li>
        </ul>
      </div>

    </div>
  </div>
</nav>
