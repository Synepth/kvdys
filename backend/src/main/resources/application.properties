spring.application.name=kvdys
server.port=8080
app.version=0.12.0

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kvdysdb
spring.datasource.username=postgres
spring.datasource.password=523461
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=kvdys-super-secret-key-must-be-at-least-32-chars-2026
jwt.expiration=86400000

# File Upload Configuration (Avatar)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=uploads/avatars